<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>강의 PPT PDF 변환기</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><script defer src="{{ url_for('static', filename='script.js') }}"></script></head><body><main><span class="badge">내 Mac에서 처리</span><h1>영상 속 슬라이드를<br>한 권의 PDF로.</h1><p>흰 배경 PPT와 필기를 모으고, 페이지 번호순으로 정리합니다.</p><form id="form"><label id="drop" for="video"><strong>영상을 여기에 놓거나 클릭하세요</strong><span>MP4 · MOV · MKV / 최대 8GB</span><input id="video" name="video" type="file" accept=".mp4,.mov,.mkv" required></label><p id="filename">선택한 영상 없음</p><button id="start">PDF 변환 시작</button></form><section aria-live="polite"><p id="status">영상을 선택하면 시작할 수 있습니다.</p><progress id="progress" max="100" value="0"></progress><p id="count"></p><a id="download" hidden>PDF 다운로드</a></section><footer>원본 영상과 임시 이미지는 처리 후 삭제됩니다.<br>완성된 PDF는 1시간 보관되며 앱 종료 시 삭제됩니다.</footer></main></body></html>
